name: Validate team knowledge

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate.py knowledge
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s examples/config-validation -p 'test_*.py' -v

      - run: cd experiments/config-agent-b && python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m unittest discover -s experiments/blind-discovery -p 'test_*.py' -v
